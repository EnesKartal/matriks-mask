# Sektör örneği: finans / aracı kurum. Başlangıç noktasıdır; kendi gerçek biçimlerinize göre daraltın (bkz. README "Kuruma özel tanımlar").
#   dene:  matriks-pii mask --config examples/sektor/finans.yaml "…"
#   ölç:   matriks-pii selftest --config examples/sektor/finans.yaml --corpus tests/fixtures/sektor/finans.jsonl
# Bu dosyadaki extra_regex listesini kendi LiteLLM config.yaml'ınızdaki matriks-pii guardrail'ine ekleyin.
guardrails:
  - guardrail_name: matriks-pii
    litellm_params:
      guardrail: matriks_pii.guardrail.TurkishPIIGuardrail
      mode: [pre_call, post_call]
      default_on: true
      profile: balanced
      # yerleşik: HESAP_NO, MUSTERI_NO, MKK_SICIL, POLICE_NO (bağlamla), IBAN, KART, TCKN, VKN
      extra_regex:
        # log/URL alanı ve FIX 1= (Account) etiketi: yalnız değer maskelenir (group)
        - {entity: HESAP_NO, pattern: '(?:AccountId=|\|1=)([0-9]{6,12})(?![0-9])', group: 1, score: 0.9}
        - {entity: KULLANICI_ADI, pattern: '(?:username=|user=|kullanıcı adı:\s*|kullanici_adi=)([\w.\-]{3,64})', group: 1, score: 0.85}
        - {entity: EMIR_NO, pattern: '(?<![0-9A-Za-z])[0-9]{8,14}(?![0-9A-Za-z])', context: 'emir no|emir numarası|order id|orderid', context_window: 15, score: 0.8}
