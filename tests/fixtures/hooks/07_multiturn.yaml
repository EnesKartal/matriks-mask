    - {role: user, content: "Ben Ayşe Demir."}
  expect_request:
    messages.0.content: "Önceki yanıt <KISI_1> içeriyordu."
    messages.1.content: "Ben <KISI_2>."
  llm_response: {content: "<KISI_1> ve <KISI_2>"}
  expect_client: {choices.0.message.content: "<KISI_1> ve Ayşe Demir"}
- id: HOOK-076
  config: {placeholder_instruction: system_suffix}
  request:
    model: m
    metadata: {}
    messages:
    - {role: system, content: "Kısa yanıtla."}
    - {role: user, content: "TCKN 17291716060"}
  expect_request:
    messages.0.content: "Kısa yanıtla.\n\nMetinde <ETİKET_n> biçiminde yer tutucular (ör. <KISI_1>, <TCKN_1>) bulunabilir. Bunlar kişisel verilerdir ve yanıtın kullanıcıya ulaşmadan önce otomatik olarak gerçek değerlerle değiştirilir. Yer tutucuyu gerçek değermiş gibi kullan: değere atıf yaparken veya kullanıcı değeri tekrar etmeni istediğinde yer tutucuyu aynen yaz (ör. <TCKN_1>). Yer tutucudan, maskelemeden ya da değeri göremediğinden söz etme; yer tutucuyu kısaltma, değiştirme ve gerçek değeri tahmin etmeye çalışma."
- id: HOOK-077
