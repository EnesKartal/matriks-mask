# Sektör örneği: sağlık. Başlangıç noktasıdır; kendi gerçek biçimlerinize göre daraltın (bkz. README "Kuruma özel tanımlar").
#   dene:  matriks-pii mask --config examples/sektor/saglik.yaml "…"
#   ölç:   matriks-pii selftest --config examples/sektor/saglik.yaml --corpus tests/fixtures/sektor/saglik.jsonl
# Bu dosyadaki extra_regex listesini kendi LiteLLM config.yaml'ınızdaki matriks-pii guardrail'ine ekleyin.
guardrails:
  - guardrail_name: matriks-pii
    litellm_params:
      guardrail: matriks_pii.guardrail.TurkishPIIGuardrail
      mode: [pre_call, post_call]
      default_on: true
      profile: balanced
      # Sağlık verisi (KVKK m.6) yerleşik OZEL_SAGLIK ile yakalanır; strict profil önerilir.
      extra_regex:
        - {entity: HASTA_NO, pattern: '(?<![0-9A-Za-z])[0-9]{6,12}(?![0-9A-Za-z])', context: 'hasta no|hasta numarası|protokol no|dosya no|patient id', context_window: 25, score: 0.85}
        # e-reçete no: 6–8 büyük harf/rakam
        - {entity: RECETE_NO, pattern: '(?<![0-9A-Za-z])(?=[A-Z0-9]*[0-9])[A-Z0-9]{6,8}(?![0-9A-Za-z])', context: 'reçete no|e-reçete|recete', context_window: 20, ignore_case: false, score: 0.85}
        - {entity: TAKIP_NO, pattern: '(?<![0-9A-Za-z])[0-9A-Z]{6,12}(?![0-9A-Za-z])', context: 'takip no|provizyon no', context_window: 20, ignore_case: false, score: 0.8}
