# Çoklu worker / çoklu replika: oturum haritası AES-GCM ile şifreli olarak Redis'te tutulur.
#   pip install "matriks-mask[redis,fast]"
#   python -m matriks_pii.keys      → MATRIKS_PII_SESSION_SECRET ve MATRIKS_PII_STORE_KEY (bir kez üretin, TÜM örneklere aynısını verin)
#   litellm --config config.redis.yaml --num_workers 4
# Sır/anahtar eksikse proxy başlangıçta hata vererek durur.
model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

guardrails:
  - guardrail_name: matriks-pii
    litellm_params:
      guardrail: matriks_pii.guardrail.TurkishPIIGuardrail
      mode: [pre_call, post_call]
      default_on: true
      session_secret: os.environ/MATRIKS_PII_SESSION_SECRET
      session_store:
        backend: redis
        redis_url: os.environ/MATRIKS_PII_REDIS_URL   # ör. rediss://:parola@redis:6380/0
        encryption_key: os.environ/MATRIKS_PII_STORE_KEY
        ttl_seconds: 3600                             # ≥ LiteLLM request_timeout
        redis_timeout_seconds: 2                      # Redis yanıt vermezse bekleme sınırı (sonra 503 + devre kesici)
        require_tls: true                             # redis:// (TLS'siz) URL başlangıçta reddedilir
      # sır/anahtar rotasyonu: MATRIKS_PII_SESSION_SECRET_PREVIOUS ve MATRIKS_PII_STORE_KEY_PREVIOUS (docs/RUNBOOK.md)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
