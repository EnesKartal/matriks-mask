# Sektör örneği: telekom. Başlangıç noktasıdır; kendi gerçek biçimlerinize göre daraltın (bkz. README "Kuruma özel tanımlar").
#   dene:  matriks-pii mask --config examples/sektor/telekom.yaml "…"
#   ölç:   matriks-pii selftest --config examples/sektor/telekom.yaml --corpus tests/fixtures/sektor/telekom.jsonl
# Bu dosyadaki extra_regex listesini kendi LiteLLM config.yaml'ınızdaki matriks-pii guardrail'ine ekleyin.
guardrails:
  - guardrail_name: matriks-pii
    litellm_params:
      guardrail: matriks_pii.guardrail.TurkishPIIGuardrail
      mode: [pre_call, post_call]
      default_on: true
      profile: balanced
      # yerleşik: TELEFON, IMEI (bağlamla, Luhn)
      extra_regex:
        - {entity: ABONE_NO, pattern: '(?<![0-9A-Za-z])[0-9]{6,12}(?![0-9A-Za-z])', context: 'abone no|abone numarası|subscriber id', context_window: 20, score: 0.85}
        # IMSI: MCC 286 (Türkiye) + MNC + MSIN = 15 hane
        - {entity: IMSI, pattern: '(?<![0-9])286[0-9]{12}(?![0-9])', context: 'imsi', score: 0.9}
        # ICCID: 89 ile başlayan 19–20 hane
        - {entity: ICCID, pattern: '(?<![0-9])89[0-9]{17,18}(?![0-9])', context: 'iccid|sim seri|sim kart no', score: 0.9}
