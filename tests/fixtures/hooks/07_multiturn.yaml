# Çok turlu konuşma, numaralama kararlılığı, rezerve yer tutucu, gölge mod. Elle yazıldı; tüm değerler sentetiktir.
- id: HOOK-072
  request:
    model: m
    metadata: {}
    messages:
    - {role: system, content: "Sen bir müşteri temsilcisisin."}
    - {role: user, content: "Ben Ayşe Demir, TCKN 17291716060."}
    - {role: assistant, content: "Merhaba Ayşe Demir, 17291716060 kaydedildi."}
    - {role: user, content: "Eşim Mehmet Demir'in telefonu 0532 234 56 78."}
  expect_request:
    messages.1.content: "Ben <KISI_1>, TCKN <TCKN_1>."
    messages.2.content: "Merhaba <KISI_1>, <TCKN_1> kaydedildi."
    messages.3.content: "Eşim <KISI_2>'in telefonu <TELEFON_1>."
  forbid: ["Ayşe Demir", "Mehmet Demir", "17291716060", "0532 234 56 78"]
  llm_response: {content: "<KISI_2> için <TELEFON_1> kaydedildi, <KISI_1>."}
  expect_client: {choices.0.message.content: "Mehmet Demir için 0532 234 56 78 kaydedildi, Ayşe Demir."}
- id: HOOK-073
  request:
    model: m
    metadata: {}
    messages:
    - {role: user, content: "Eşim Mehmet Demir'in telefonu 0532 234 56 78."}
    - {role: assistant, content: "Kaydettim."}
    - {role: user, content: "Ayşe Demir'in de kaydını aç."}
  expect_request:
    messages.0.content: "Eşim <KISI_1>'in telefonu <TELEFON_1>."
    messages.2.content: "<KISI_2>'in de kaydını aç."
