# Sektör örneği: yurt dışı biçimler. Başlangıç noktasıdır; kendi gerçek biçimlerinize göre daraltın (bkz. README "Kuruma özel tanımlar").
#   dene:  matriks-pii mask --config examples/sektor/yurtdisi.yaml "…"
#   ölç:   matriks-pii selftest --config examples/sektor/yurtdisi.yaml --corpus tests/fixtures/sektor/yurtdisi.jsonl
# Bu dosyadaki extra_regex listesini kendi LiteLLM config.yaml'ınızdaki matriks-pii guardrail'ine ekleyin.
guardrails:
  - guardrail_name: matriks-pii
    litellm_params:
      guardrail: matriks_pii.guardrail.TurkishPIIGuardrail
      mode: [pre_call, post_call]
      default_on: true
      profile: balanced
      # Yabancı adlar sözlükte yok; yurt dışı metinler için NER önerilir:
      #   name_detection: {ner_backend: hf}      (pip install "matriks-mask[ner]")
      extra_regex:
        # uluslararası telefon (+90 hariç; TR numaraları yerleşik TELEFON kuralıyla yakalanır)
        - {entity: TELEFON, pattern: '(?<![0-9A-Za-z+])\+(?!90)(?=(?:[ ()\-]*[0-9]){8,15}(?![0-9]))[1-9][0-9 ()\-]{6,18}[0-9]', score: 0.8}
        - {entity: US_SSN, pattern: '(?<![0-9])[0-9]{3}-[0-9]{2}-[0-9]{4}(?![0-9])', context: 'ssn|social security', score: 0.85}
        - {entity: UK_NINO, pattern: '(?<![A-Za-z])[A-CEGHJ-PR-TW-Z]{2} ?[0-9]{2} ?[0-9]{2} ?[0-9]{2} ?[A-D](?![A-Za-z])', context: 'national insurance|nino', score: 0.85}
